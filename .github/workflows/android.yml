name: Android CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MODEL_PATH: app/src/main/assets/vehicle_trajectory.tflite

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the model is needed, and caching it keeps Git LFS bandwidth near zero.
      - name: Hash LFS model pointer
        run: git lfs ls-files -l --include="$MODEL_PATH" | cut -d' ' -f1 > .lfs-model-id

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-model-id') }}

      - name: Fetch model from Git LFS
        run: |
          git lfs pull --include="$MODEL_PATH"
          size=$(stat -c%s "$MODEL_PATH")
          echo "Model size: $size bytes"
          test "$size" -gt 1000000

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          test "$version" = "${GITHUB_REF_NAME#v}" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          }

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key available; building unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "V2V_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          V2V_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature
        if: env.V2V_KEYSTORE_PATH != ''
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk"
          cp "$apk" V2V-App.apk
          sha256sum V2V-App.apk > V2V-App.apk.sha256

      - name: Require a signed APK for releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -f V2V-App.apk || {
            echo "::error::Release tags require the signing secrets"
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.V2V_KEYSTORE_PATH != ''
        with:
          name: V2V-App
          path: |
            V2V-App.apk
            V2V-App.apk.sha256
          retention-days: 14
          if-no-files-found: error

  smoke-test:
    # R8-shrunk builds can crash at launch even when they compile, so a release
    # is only published after the signed APK has launched on an emulator.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: V2V-App

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-test.sh V2V-App.apk

  release:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: V2V-App

      # The fixed asset name keeps the releases/latest/download link stable.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" V2V-App.apk V2V-App.apk.sha256 \
            --title "V2V App $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
